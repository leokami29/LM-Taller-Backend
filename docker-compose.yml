services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sgtaller
      POSTGRES_PASSWORD: sgtaller_password
      POSTGRES_DB: sgtaller_db
    ports:
      - "5432:5432"
    volumes:
      - sgtaller_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgtaller -d sgtaller_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sgtaller_minio_data:/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sgtaller:sgtaller_password@postgres:5432/sgtaller_db
      SECRET_KEY: dev-secret-change-in-docker-compose
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  sgtaller_pg_data:
  sgtaller_minio_data:
